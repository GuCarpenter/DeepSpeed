name: klxpu

on:
  workflow_dispatch:
  schedule:
    # Nightly backstop: the v1 suite exercises most of the library, so run once
    # a day even when a PR touches code outside the paths filter below.
    - cron: "0 0 * * *"
  push:
    branches:
      - 'ci/klxpu-runner'
  pull_request:
    paths:
      - ".github/workflows/klxpu.yml"
      - ".github/workflows/klxpu/**"
      - "accelerator/**"
      - "op_builder/**"
      - "deepspeed/**"
      - "tests/unit/v1/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: klxpu / unit tests
    runs-on: [self-hosted, klxpu]
    timeout-minutes: 150
    container:
      image: hub.kunlunxin.com/public/klxpu-deepspeed:latest
      options: >-
        --privileged --ipc=host --cap-add=ALL
        --device /dev/xpuctrl
        --device /dev/xpu0 --device /dev/xpu1 --device /dev/xpu2 --device /dev/xpu3
        --device /dev/xpu4 --device /dev/xpu5 --device /dev/xpu6 --device /dev/xpu7
      volumes:
        # Route all test scratch (TMPDIR below) onto a 512-byte-sector disk. The
        # async_io op assumes 512-byte O_DIRECT alignment and silently fails on
        # 4Kn (4096-sector) storage. Per-machine host path via Actions variable.
        - ${{ vars.KLXPU_AIO_SCRATCH || '/tmp/klx_aio_scratch' }}:/aio_scratch
      env:
        # Per-machine proxy; set the repo/org Actions variables on hosts that
        # need one, leave unset for hosts with direct access.
        http_proxy: ${{ vars.KLXPU_HTTP_PROXY }}
        https_proxy: ${{ vars.KLXPU_HTTPS_PROXY }}

    env:
      CUDA_VISIBLE_DEVICES: "0,1,2,3"
      # Put all pytest/tempfile scratch on the 512-sector mount above (volumes),
      # so async_io's O_DIRECT I/O works regardless of the host disk sector size.
      TMPDIR: /aio_scratch
      # Cache Hugging Face downloads (transformers configs/tokenizers/models) in
      # a known writable path; ephemeral since the container is recreated.
      HF_HOME: /tmp/hf_home
      # Per-machine Hugging Face mirror; set the Actions variable on hosts that
      # cannot reach huggingface.co, leave unset for hosts with direct access.
      HF_ENDPOINT: ${{ vars.KLXPU_HF_ENDPOINT }}
      # Force plain-HTTPS LFS instead of the Xet backend, whose CDN
      # (cas-bridge.xethub.hf.co) is unreachable behind a mirror and otherwise
      # stalls weight downloads until the test times out.
      HF_HUB_DISABLE_XET: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve conda env
        shell: bash
        run: |
          source /root/miniconda/etc/profile.d/conda.sh
          conda_env="$(conda env list | awk '$1 != "base" && $1 !~ /^#/ && NF {print $1; exit}')"
          test -n "$conda_env"
          echo "Using conda env: $conda_env"
          echo "CONDA_ENV=$conda_env" >> "$GITHUB_ENV"

      - name: Environment report
        shell: bash
        run: |
          source /root/miniconda/etc/profile.d/conda.sh
          conda activate "$CONDA_ENV"
          xpu-smi || true
          python --version
          python -c "import torch, torch_xmlir; print('torch:', torch.__version__)"
          python -c "import torch; print('device_count:', torch.cuda.device_count())"

      - name: Install DeepSpeed (working tree)
        shell: bash
        run: |
          source /root/miniconda/etc/profile.d/conda.sh
          conda activate "$CONDA_ENV"
          env -u http_proxy -u https_proxy pip install -U transformers
          pip uninstall -y deepspeed || true
          pip install -e . --no-deps --no-build-isolation
          ds_report

      - name: Check accelerator is klxpu
        shell: bash
        run: |
          source /root/miniconda/etc/profile.d/conda.sh
          conda activate "$CONDA_ENV"
          python -c "from deepspeed.accelerator import get_accelerator; name = get_accelerator()._name; print('accelerator:', name); assert name == 'klxpu', name"

      - name: Unit tests
        shell: bash
        run: |
          source /root/miniconda/etc/profile.d/conda.sh
          conda activate "$CONDA_ENV"
          bash .github/workflows/klxpu/run-tests.sh
